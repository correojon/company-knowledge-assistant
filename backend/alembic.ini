# Alembic configuration. The app runs migrations itself at startup (app.db.migrate);
# this file serves the `alembic` CLI, e.g. `uv run alembic revision -m "..."`.
# The database URL comes from the app's Settings (DATA_DIR), not from this file.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
